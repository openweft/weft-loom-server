version: '3'

# weft-loom-server : collaborative editor + sandboxed compile.
# Pure-Go server (CGO=0) ; Svelte+CodeMirror+Yjs frontend embedded
# at build time via //go:embed.

vars:
  BINARY: weft-loom
  PKG: github.com/openweft/weft-loom-server
  VERSION: '{{.VERSION | default "dev"}}'
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X {{.PKG}}/cmd/{{.BINARY}}.version={{.VERSION}}
    -X {{.PKG}}/cmd/{{.BINARY}}.commit={{.COMMIT}}
    -X {{.PKG}}/cmd/{{.BINARY}}.date={{.DATE}}

tasks:
  default:
    cmds: [task --list-all]

  vet:
    cmds: [go vet ./...]

  test:
    cmds: [go test -count=1 ./...]

  web-deps:
    desc: Install frontend deps (one-shot)
    dir: web
    cmds: [npm install]
    status: [test -d node_modules]

  gen-collab-wasm:
    desc: Build the collaborative editing client into web/public
    # The editor is TypeScript and cannot call Go, so the client is compiled to
    # WebAssembly and reached through globalThis.collab. It goes in public/ for
    # the same reason the icons do: vite copies that into the bundle the Go
    # binary embeds, so `go build` stays the single source of truth for what is
    # deployed.
    #
    # wasm_exec.js comes from the toolchain rather than the repository, because a
    # copy checked in is a copy that silently stops matching the compiler.
    cmds:
      - GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o web/public/collab.wasm github.com/go-crdt/collab/wasm
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/public/wasm_exec.js
      # The declarations come from the same module as the binary, so they cannot
      # describe a version that is not the one running.
      # The module cache is read-only, so the copy is too until told otherwise —
      # and a second run would fail on its own output.
      - cp "$(go list -m -f '{{.Dir}}' github.com/go-crdt/collab)/wasm/collab.d.ts" web/src/lib/collab.d.ts
      - chmod u+w web/src/lib/collab.d.ts
    sources:
      - go.mod
      - go.sum
    generates:
      - web/public/collab.wasm
      - web/public/wasm_exec.js
      - web/src/lib/collab.d.ts

  web-build:
    desc: Build the SPA into internal/web/dist (read by //go:embed)
    deps: [web-deps, gen-api, gen-collab-wasm]
    dir: web
    cmds: [npm run build]

  web-check:
    desc: TypeScript + Svelte lint
    deps: [web-deps, gen-api, gen-collab-wasm]
    dir: web
    cmds: [npm run check]

  gen-api:
    desc: Regenerate openapi.json + TypeScript client (huma is the source of truth)
    deps: [web-deps]
    cmds:
      - go run ./tools/dump-openapi > openapi.json
      - cd web && npm run gen-api
    sources:
      - 'internal/server/api_*.go'
      - 'tools/dump-openapi/main.go'
    generates:
      - openapi.json
      - web/src/lib/api.gen.ts

  build:
    desc: Build the server binary (host arch)
    deps: [web-build]
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/{{.BINARY}}

  cross-build:
    desc: Cross-build the binary for linux + darwin × amd64 + arm64
    deps: [web-build]
    cmds:
      - mkdir -p dist
      - |
        for goos in linux darwin; do
          for goarch in amd64 arm64; do
            out=dist/{{.BINARY}}-$goos-$goarch
            echo "build $out"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags "{{.LDFLAGS}}" \
              -o "$out" ./cmd/{{.BINARY}}
          done
        done

  ci:
    desc: Full CI sequence
    cmds:
      - task: vet
      - task: test
      - task: gen-api
      - task: web-check
      - task: cross-build

  dev:
    desc: Run server + Vite dev server in parallel (split your terminal)
    cmds:
      - |
        echo 'In one terminal :'
        echo '  go run ./cmd/{{.BINARY}} serve --config ./config.dev.hcl'
        echo
        echo 'In another :'
        echo '  cd web && npm run dev'
        echo
        echo 'Vite proxies /api + WS to localhost:8080 ; open http://localhost:5173'

  clean:
    cmds:
      - rm -rf dist {{.BINARY}}
      - rm -rf web/node_modules web/dist
      - rm -rf internal/web/dist/*
