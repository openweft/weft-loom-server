name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        run: cd web && npm ci
      # Before the build, not after: vite copies web/public into the bundle the
      # Go binary embeds. Without it the release ships an editor that loads and
      # never collaborates.
      - name: generate the collab client
        run: ./scripts/gen-collab-wasm.sh
      - name: regenerate openapi + ts client + vite build
        run: |
          go run ./tools/dump-openapi > openapi.json
          cd web && npm run gen-api && npm run build
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="weft-loom-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags "\
            -X github.com/openweft/weft-loom-server/cmd/weft-loom.version=$version \
            -X github.com/openweft/weft-loom-server/cmd/weft-loom.commit=${GITHUB_SHA::7} \
            -X github.com/openweft/weft-loom-server/cmd/weft-loom.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$out" ./cmd/weft-loom
      - uses: actions/upload-artifact@v7
        with:
          name: weft-loom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: weft-loom-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: weft-loom-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/weft-loom-*
          generate_release_notes: true
