name: Release OCI image

# Multi-arch (amd64 + arm64) OCI image build for the weft-loom-server
# microVM rootfs. Pulled by weft-agent on each DC via
# `weft microvm pull` / autopull from cluster.hcl.
#
# Triggers : workflow_dispatch (manual) + push of a v* tag. Matches
# the openweft no-autopublish-during-dev policy (memory
# feedback_no_autopublish_dev).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default : v<short-sha>)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/openweft/weft-loom-server:${{ steps.tag.outputs.tag }}
            ghcr.io/openweft/weft-loom-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
