name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 -race ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath ./cmd/weft-loom

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        run: cd web && npm ci
      - name: regenerate openapi + ts client
        run: |
          go run ./tools/dump-openapi > openapi.json
          cd web && npm run gen-api
      - name: svelte-check (informational — 54 pre-existing baseline errors)
        # Non-blocking : the SPA has a baseline of unused-import / unused-prop
        # warnings flagged as errors by svelte-check that pre-date this CI job.
        # The vite build below still validates that the SPA actually compiles.
        # Cleanup is tracked as follow-up — strict mode goes back on once the
        # baseline is at zero.
        continue-on-error: true
        run: cd web && npm run check
      - name: vite build
        run: cd web && npm run build
