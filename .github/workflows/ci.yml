name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # internal/lintchktex exists to wrap the chktex binary and parse its
      # output. Without the binary, the two tests that check that parse against
      # what chktex actually prints do not run -- and an output format is
      # exactly the kind of thing a hand-written fixture gets subtly wrong.
      #
      # chktex is a standalone package, not all of TeX Live; the skip message
      # in lint_test.go already says `apt-get install chktex`.
      - name: chktex, so the parser is tested against real output
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chktex
      - name: test
        env:
          # A skip here would look exactly like a pass.
          LOOM_REQUIRE_CHKTEX: "1"
        run: go test -count=1 -race ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath ./cmd/weft-loom

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go.mod has `replace` directives pointing at sibling
      # workspace dirs (../weft-microvm-init, ../weft-microvm-agent)
      # — they exist locally but not in CI. Clone them shallowly
      # at the expected relative path so `go vet` + `go build` + the
      # web-check's openapi dump can resolve the imports.
      - name: fetch sibling repos referenced by go.mod replace
        run: |
          cd ..
          git clone --depth=1 https://github.com/openweft/weft-microvm-init.git
          git clone --depth=1 https://github.com/openweft/weft-microvm-agent.git
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web deps
        run: cd web && npm ci
      # The collab client and its type declarations are generated rather than
      # checked in, so svelte-check cannot resolve './collab.d' without this —
      # and reports forty cascading "implicitly has an 'any' type" errors from
      # the one missing file.
      - name: generate the collab client
        run: ./scripts/gen-collab-wasm.sh
      - name: regenerate openapi + ts client
        run: |
          go run ./tools/dump-openapi > openapi.json
          cd web && npm run gen-api
      - name: svelte-check
        run: cd web && npm run check
      - name: vite build
        run: cd web && npm run build
